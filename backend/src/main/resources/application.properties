spring.application.name=shopsphere
server.port=${PORT:8080}

# Optional local .env file (backend/.env). Real environment variables also work and take precedence.
spring.config.import=optional:file:./.env[.properties]

# --- Database (secrets come from environment / .env) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/shopsphere}
spring.datasource.username=${DB_USERNAME:shopsphere}
spring.datasource.password=${DB_PASSWORD}

# Tables are created/updated automatically (fine for learning; use migrations for production)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Application settings ---
app.token-secret=${TOKEN_SECRET}
app.token-expiry-hours=${TOKEN_EXPIRY_HOURS:8}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.admin.email=${ADMIN_EMAIL:admin@shopsphere.local}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
app.seed.demo-data=${SEED_DEMO_DATA:true}
